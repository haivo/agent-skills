trigger:
  branches:
    include:
      - main

pool: Default   # your self-hosted agent

variables:
  buildConfiguration: Release

stages:
  - stage: Build
    jobs:
      - job: Build
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: 10.x

          - script: dotnet restore OnlineStore.slnx
            displayName: Restore

          - script: dotnet build OnlineStore.slnx --configuration $(buildConfiguration) --no-restore
            displayName: Build

          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
              projects: src/Test/Test.csproj
              arguments: --configuration $(buildConfiguration) --no-build

          - task: DotNetCoreCLI@2
            displayName: Publish API
            inputs:
              command: publish
              publishWebProjects: false
              projects: src/Api/Api.csproj
              arguments: --configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)
              zipAfterPublish: true

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: drop

  - stage: Deploy
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployApi
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: Deploy to App Service
                  inputs:
                    azureSubscription: azure-onlinestore
                    appType: webApp
                    appName: rg-onlinestore
                    package: $(Pipeline.Workspace)/drop/**/*.zip